<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SYS – KOOP + POOK Finder</title>

<style>
body {
    background:#000;
    color:#0f0;
    font-family:Consolas, monospace;
    padding:20px;
}
h2 { color:#6cf; }
#panel {
    border:1px solid #333;
    padding:15px;
    margin-bottom:25px;
    background:#111;
}
pre {
    background:#000;
    padding:12px;
    border:1px solid #333;
    white-space:pre;
}
</style>
</head>
<body>

<div id="panel">
    <h2>SYS – KOOP + POOK Finder</h2>
    <pre id="sys-output">Lade SYS…</pre>
</div>

<script type="module">

import { SYS_FIND_KOOP_POOK } from "./SYS.js";

// VECTOR.EXP ist global verfügbar
const vector = window.vectorEXP;

// RESPO‑CSV laden
async function loadRESPO_CSV() {
    const res = await fetch("./respo-funktion-6.csv");
    const text = await res.text();

    // CSV → Array
    const lines = text.trim().split("\n").slice(1);
    return lines.map(line => {
        const [key, func, connect] = line.split(",");
        return { key, func, "Connect‑Fähigkeit": connect };
    });
}

async function runSYS() {

    const respoList = await loadRESPO_CSV();

    // KOOP + POOK Finder
    const result = SYS_FIND_KOOP_POOK(respoList);

    // Ausgabe
    document.getElementById("sys-output").innerText =
        JSON.stringify(result, null, 2);
}

runSYS();

</script>

</body>
</html>
