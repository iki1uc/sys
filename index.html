<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SYS – HH + RESPO</title>

<style>
body {
    background:#000;
    color:#0f0;
    font-family:Consolas, monospace;
    padding:20px;
}
h2 { color:#6cf; }
#hh-panel, #respo-panel {
    border:1px solid #333;
    padding:15px;
    margin-bottom:25px;
    background:#111;
}
pre {
    background:#000;
    padding:12px;
    border:1px solid #333;
    white-space:pre;
}
</style>
</head>
<body>

<!-- HH PANEL -->
<div id="hh-panel">
    <h2>HH – Host‑Hub Panel</h2>

    <div id="pq-status"></div>
    <div id="px-status"></div>
    <div id="pr-status"></div>
</div>

<!-- RESPO PANEL -->
<div id="respo-panel">
    <h2>RESPO – NC.RESPO.json</h2>
    <pre id="respo-list">Lade RESPO…</pre>
</div>

<script>
// ------------------------------------------------------------
// HH – Host‑Hub Erkennung
// ------------------------------------------------------------
(function () {

    const ua = navigator.userAgent || navigator.vendor || window.opera;

    const isAppleMobile = /iPhone|iPad|iPod/i.test(ua);
    const isAndroidMobile = /Android/i.test(ua) && /Mobile/i.test(ua);
    const isTablet = /iPad|Tablet|Tab/i.test(ua);
    const isDesktop = !isAppleMobile && !isAndroidMobile && !isTablet;

    const pq = document.getElementById("pq-status");
    const px = document.getElementById("px-status");
    const pr = document.getElementById("pr-status");

    if (isAppleMobile || isAndroidMobile || isTablet) {
        px.innerHTML = "PX – <b>Apple/Mobile</b> <span>📱</span>";
        window.location.replace("https://iki1uc.github.io/viPIio/");
        return;
    }

    pq.innerHTML = "PQ – <b>Laptop</b> <span>💻</span>";
    pr.innerHTML = "PR – <b>Desktop</b> <span>🖥️</span>";

})();
</script>

<script type="module">
// ------------------------------------------------------------
// RESPO – NC.RESPO.json laden und anzeigen
// ------------------------------------------------------------
async function loadRESPO() {

    try {
        const res = await fetch("./NC.RESPO.json");
        const json = await res.json();

        const R = json["NC.RESPO"];

        const list = Object.entries(R).map(([key, value]) => {
            return { key, value };
        });

        document.getElementById("respo-list").innerText =
            JSON.stringify(list, null, 2);

    } catch (e) {
        document.getElementById("respo-list").innerText =
            "Fehler beim Laden von NC.RESPO.json";
    }
}

loadRESPO();
</script>

</body>
</html>
